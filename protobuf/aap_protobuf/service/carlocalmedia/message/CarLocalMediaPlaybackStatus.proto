syntax="proto2";

option optimize_for=SPEED;

import "aap_protobuf/service/carlocalmedia/message/CarLocalMediaPlaybackState.proto";
import "aap_protobuf/service/carlocalmedia/message/CarLocalMediaPlaybackAction.proto";

package aap_protobuf.service.carlocalmedia.message;

// 0x8001 HU -> phone. Source: open-android-auto docs/channels/media.md; verified with a phone (average-web-dev/openhu#147).
message CarLocalMediaPlaybackStatus {
  optional CarLocalMediaPlaybackState playback_state = 1;
  optional string media_source = 2;                      // e.g. "FM Radio", "USB"
  optional int32 playback_position = 3;                  // elapsed seconds
  repeated CarLocalMediaPlaybackAction actions = 4;      // the buttons the phone shows
}
