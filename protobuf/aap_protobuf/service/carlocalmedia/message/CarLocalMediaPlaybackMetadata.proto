syntax="proto2";

option optimize_for=SPEED;

package aap_protobuf.service.carlocalmedia.message;

// 0x8002 HU -> phone. Source: open-android-auto docs/channels/media.md; song, artist and a PNG album_art verified
// with a phone (average-web-dev/openhu#147).
message CarLocalMediaPlaybackMetadata {
  optional string song = 1;
  optional string artist = 2;
  optional string album = 3;
  optional bytes album_art = 4;            // image bytes (PNG, JPEG)
  optional uint32 duration_seconds = 5;
}
