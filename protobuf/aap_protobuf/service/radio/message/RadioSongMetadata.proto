syntax="proto2";

option optimize_for=SPEED;

import "aap_protobuf/service/radio/message/RadioImage.proto";

package aap_protobuf.service.radio.message;

// Radio v2 (Android Auto 16.2+). Source: open-android-auto @ 61eab61, oaa/radio/RadioMessages.proto, confidence silver (APK static
// analysis, not verified against a phone). average-web-dev/aasdk#32
message RadioSongMetadata {
  optional string title = 1;
  optional string artist = 2;
  optional string album = 3;
  optional string genre = 4;
  optional RadioImage album_art = 5;
  optional uint64 duration_seconds = 6;
}
