syntax="proto2";

option optimize_for=SPEED;

package aap_protobuf.service.radio.message;

// Radio v2 (Android Auto 16.2+). Source: open-android-auto @ 61eab61, oaa/radio/RadioMessages.proto, confidence silver (APK static
// analysis, not verified against a phone). average-web-dev/aasdk#32
// Phone -> HU (0x8023, new in Android Auto 16.2): a custom action of the radio browser, e.g. the
// band_scan_action of a RadioBandGroup. oaa's proto calls the field "query", its documentation "action_id".
message RadioSearchRequest {
  optional string action_id = 1;
}
