syntax="proto2";

option optimize_for=SPEED;

import "aap_protobuf/service/radio/message/RadioProgramInfo.proto";

package aap_protobuf.service.radio.message;

// Radio v2 (Android Auto 16.2+). Source: open-android-auto @ 61eab61, oaa/radio/RadioMessages.proto, confidence silver (APK static
// analysis, not verified against a phone). average-web-dev/aasdk#32
// HU -> phone (0x801B): current station, mute and audio focus; after every tune/seek and on metadata changes
message RadioProgramInfoNotification {
  optional RadioProgramInfo program_info = 1;
  optional bool is_muted = 2;
  optional bool has_audio_focus = 3;
}
