syntax="proto2";

option optimize_for=SPEED;

import "aap_protobuf/service/radio/message/RadioBandType.proto";

package aap_protobuf.service.radio.message;

// Radio v2 (Android Auto 16.2+). Source: open-android-auto @ 61eab61, oaa/control/RadioChannelData.proto, confidence silver (APK static
// analysis, not verified against a phone). average-web-dev/aasdk#32
// One browse node of the phone's radio UI (e.g. "FM", or AM and FM together)
message RadioBandGroup {
  repeated RadioBandType band_types = 1;
  // hide the node while it has no stations
  optional bool hide_empty_group = 2;
  // action id the phone sends as RadioSearchRequest to scan this band
  optional string band_scan_action = 3;
  // Android Auto 17.3, meaning unknown
  optional bool unknown_flag_4 = 4;
}
