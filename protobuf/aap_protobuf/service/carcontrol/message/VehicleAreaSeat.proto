syntax="proto2";

option optimize_for=SPEED;

package aap_protobuf.service.carcontrol.message;

// VHAL seat bits.
// Source: Android Auto 17.9 app analysis. average-web-dev/aasdk#40
// ROW_1_LEFT and ROW_1_RIGHT verified with a phone (openhu#121).
enum VehicleAreaSeat {
  SEAT_UNKNOWN = 0;
  SEAT_ROW_1_LEFT = 1;
  SEAT_ROW_1_CENTER = 2;
  SEAT_ROW_1_RIGHT = 4;
  SEAT_ROW_2_LEFT = 16;
  SEAT_ROW_2_CENTER = 32;
  SEAT_ROW_2_RIGHT = 64;
  SEAT_ROW_3_LEFT = 256;
  SEAT_ROW_3_RIGHT = 1024;
}
