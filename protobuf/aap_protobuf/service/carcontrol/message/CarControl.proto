syntax="proto2";

option optimize_for=SPEED;

import "aap_protobuf/service/carcontrol/message/CarPropertyControl.proto";
import "aap_protobuf/service/carcontrol/message/CarActionControl.proto";
import "aap_protobuf/service/carcontrol/message/CarControlGroupType.proto";
import "aap_protobuf/service/carcontrol/message/CarControlMetadata.proto";
import "aap_protobuf/service/carcontrol/message/CarControlSideAffinity.proto";

package aap_protobuf.service.carcontrol.message;

// Source: Android Auto 17.9 app analysis; verified with a phone (Fairphone 4, average-web-dev/openhu#121).
// CarControl and CarControlGroup contain each other, so both are in this file.
message CarControl {
  oneof control {
    CarPropertyControl property_control = 1;
    CarActionControl action_control = 2;
    CarControlGroup control_group = 3;
  }
  optional bool enabled = 4 [default = true];
  repeated CarControlMetadata metadata = 5;
  optional CarControlSideAffinity side_affinity = 6;
}

message CarControlGroup {
  optional CarControlGroupType group_type = 1;
  repeated CarControl controls = 2;
}
