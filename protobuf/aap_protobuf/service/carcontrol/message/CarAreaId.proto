syntax="proto2";

option optimize_for=SPEED;

import "aap_protobuf/service/carcontrol/message/GlobalArea.proto";
import "aap_protobuf/service/carcontrol/message/VehicleAreaSeat.proto";
import "aap_protobuf/service/carcontrol/message/VehicleAreaWindow.proto";
import "aap_protobuf/service/carcontrol/message/VehicleAreaDoor.proto";
import "aap_protobuf/service/carcontrol/message/VehicleAreaWheel.proto";
import "aap_protobuf/service/carcontrol/message/VehicleAreaMirror.proto";

package aap_protobuf.service.carcontrol.message;

// One area: exactly one of the fields. A list means the OR of its bits (seats [ROW_1_LEFT, ROW_1_RIGHT] = both front
// seats). An empty CarAreaId is invalid; the phone compares areas exactly (type and bits).
// Source: Android Auto 17.9 app analysis. average-web-dev/aasdk#40
// global and seats verified with a phone (openhu#121). open-android-auto: 1 area type, 2 window, 3 seat, 4 mirror,
// 5 door, 6 wheel.
message CarAreaId {
  optional GlobalArea global = 1;
  repeated VehicleAreaSeat seats = 2 [packed = true];
  repeated VehicleAreaWindow windows = 3 [packed = true];
  repeated VehicleAreaDoor doors = 4 [packed = true];
  repeated VehicleAreaWheel wheels = 5 [packed = true];
  repeated VehicleAreaMirror mirrors = 6 [packed = true];
}
