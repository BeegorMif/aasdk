syntax="proto2";

option optimize_for=SPEED;

import "aap_protobuf/service/carcontrol/message/CarProperty.proto";
import "aap_protobuf/service/carcontrol/message/CarPropertyValue.proto";
import "aap_protobuf/service/carcontrol/message/CarPropertyStatus.proto";

package aap_protobuf.service.carcontrol.message;

// Source: Android Auto 17.9 app analysis; verified with a phone (Fairphone 4, average-web-dev/openhu#121).
message CarPropertyChangeEvent {
  optional CarProperty property = 1;
  optional CarPropertyValue value = 2;  // must be set with AVAILABLE
  optional CarPropertyStatus status = 3;
}
