syntax="proto2";

package aap_protobuf.aaw;

// Field numbers and names from Android Auto traffic as documented by Open Headunit (wireless.proto,
// andreknieriem/open-headunit@4ee1d58) and aa-proxy-rs; written for aasdk (average-web-dev/aasdk#8).
// Phone -> head unit: whether it joined the network. status holds a Status value; int32 so that a status
// the enum does not know yet stays readable.
message WifiConnectionStatus {
  optional int32 status = 1;
  optional string error_message = 2;
}
