syntax="proto2";

package aap_protobuf.aaw;

// Field numbers and names from Android Auto traffic as documented by Open Headunit (wireless.proto,
// andreknieriem/open-headunit@4ee1d58) and aa-proxy-rs; written for aasdk (average-web-dev/aasdk#8).
// Bands the head unit's access point can offer (WifiVersionRequest). The phone answers
// STATUS_NO_SUPPORTED_WIFI_CHANNELS if it cannot use any of them.
enum WifiChannelType {
  CHANNELS_5GHZ_ONLY = 0;
  CHANNELS_24GHZ_ONLY = 1;
  CHANNELS_DUAL_BAND = 2;
  NO_CHANNELS_SUPPORTED = 3;
}
