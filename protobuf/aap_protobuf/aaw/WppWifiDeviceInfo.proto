syntax="proto2";

package aap_protobuf.aaw;

// Field numbers and names from Android Auto traffic as documented by Open Headunit (wireless.proto,
// andreknieriem/open-headunit@4ee1d58) and aa-proxy-rs; written for aasdk (average-web-dev/aasdk#8).
// The phone as it describes itself in WifiVersionResponse
message WppWifiDeviceInfo {
  optional string device_id = 1;
  optional string connectivity_lifetime_id = 2;
  optional string device_name = 3;
  optional string bluetooth_address = 4;
}
